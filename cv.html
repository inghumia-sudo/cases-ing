<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#EDEEE8">
<title>Ingrid Humia — CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: only light;
    --paper:#EDEEE8;
    --ink:#1C2127;
    --ink-soft:#4B5259;
    --line:#C7CABF;
    --blueprint:#2A6F84;
    --blueprint-soft:#DCE7E6;
    --white:#FAFAF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{color-scheme: only light;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    padding:20px 24px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
  }
  header a.back{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    text-decoration:none;
  }
  header a.back:hover{ color:var(--ink); }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:19px;
    margin:0;
  }
  a.download{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--white);
    background:var(--blueprint);
    text-decoration:none;
    padding:9px 16px;
    border-radius:6px;
  }
  .viewer-wrap{
    max-width:900px;
    margin:24px auto;
    padding:0 24px;
  }
  .viewer{
    width:100%;
    height:85vh;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
  }
  .fallback{
    text-align:center;
    padding:60px 20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .fallback a{ color:var(--blueprint); }
</style>
</head>
<body>
  <header>
    <a class="back" href="index.html">&larr; voltar</a>
    <h1>Ingrid Humia — Currículo</h1>
    <a class="download" href="Ingrid_Humia_CV.pdf" download>Baixar PDF</a>
  </header>
  <div class="viewer-wrap">
    <object class="viewer" data="Ingrid_Humia_CV.pdf" type="application/pdf">
      <div class="fallback">
        Seu navegador não conseguiu exibir o PDF aqui.
        <br><a href="Ingrid_Humia_CV.pdf">Clique para abrir o CV</a>.
      </div>
    </object>
  </div>
</body>
</html>
