128\" width=\"222\" height=\"212\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#E4E3DC\"><\u002Frect>\n          <rect x=\"290\" y=\"128\" width=\"222\" height=\"4\" fill=\"#C9CCC4\"><\u002Frect>\n          <text x=\"310\" y=\"162\" font-family=\"Archivo\" font-size=\"15\" fill=\"#15181B\">Movimentar<\u002Ftext>\n          <text x=\"310\" y=\"182\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">dinheiro em trânsito<\u002Ftext>\n          <line x1=\"310\" y1=\"196\" x2=\"492\" y2=\"196\" stroke=\"#E4E3DC\"><\u002Fline>\n          <text x=\"310\" y=\"220\" font-family=\"Archivo\" font-size=\"11.5\" fill=\"#15181B\">Pagamentos<\u002Ftext>\n          <text x=\"310\" y=\"246\" font-family=\"Archivo\" font-size=\"11.5\" fill=\"#15181B\">Aprovações<\u002Ftext>\n          <text x=\"310\" y=\"272\" font-family=\"Archivo\" font-size=\"11.5\" fill=\"#15181B\">Transferências<\u002Ftext>\n          <text x=\"310\" y=\"298\" font-family=\"Archivo\" font-size=\"11.5\" fill=\"#15181B\">Recargas de cartão<\u002Ftext>\n          <rect x=\"310\" y=\"314\" width=\"88\" height=\"18\" rx=\"9\" fill=\"#F4F2EC\"><\u002Frect>\n          <text x=\"354\" y=\"327\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">4 seções<\u002Ftext>\n\n          <rect x=\"528\" y=\"128\" width=\"222\" height=\"212\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#E4E3DC\"><\u002Frect>\n          <rect x=\"528\" y=\"128\" width=\"222\" height=\"4\" fill=\"#C9CCC4\"><\u002Frect>\n          <text x=\"548\" y=\"162\" font-family=\"Archivo\" font-size=\"15\" fill=\"#15181B\">Acompanhar<\u002Ftext>\n          <text x=\"548\" y=\"182\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">o que já aconteceu<\u002Ftext>\n          <line x1=\"548\" y1=\"196\" x2=\"730\" y2=\"196\" stroke=\"#E4E3DC\"><\u002Fline>\n          <text x=\"548\" y=\"220\" font-family=\"Archivo\" font-size=\"11.5\" fill=\"#15181B\">Extrato<\u002Ftext>\n          <text x=\"548\" y=\"246\" font-family=\"Archivo\" font-size=\"11.5\" fill=\"#15181B\">Despesas por centro<\u002Ftext>\n          <text x=\"548\" y=\"272\" font-family=\"Archivo\" font-size=\"11.5\" fill=\"#15181B\">Comprovantes<\u002Ftext>\n          <text x=\"548\" y=\"298\" font-family=\"Archivo\" font-size=\"11.5\" fill=\"#15181B\">Exportações<\u002Ftext>\n          <rect x=\"548\" y=\"314\" width=\"88\" height=\"18\" rx=\"9\" fill=\"#F4F2EC\"><\u002Frect>\n          <text x=\"592\" y=\"327\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">4 seções<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#565C60;padding:11px 16px;border-top:1px solid #D3D2C6\"><span style=\"display:{{ dPt }}\">Mockup fictício — nova arquitetura de navegação: Organizar / Movimentar / Acompanhar<\u002Fspan><span style=\"display:{{ dEn }}\">Fictional mockup — new navigation architecture: Organize / Move / Track<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"case-5\" data-screen-label=\"Case 05\" style=\"padding:72px 0;border-top:1px solid #D3D2C6\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:8px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:0.8;color:#1D5F6B\">05<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#565C60\"><span style=\"display:{{ dPt }}\">Blueprint de operação<\u002Fspan><span style=\"display:{{ dEn }}\">Operations blueprint<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }}\">\n        <div>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\"><span style=\"display:{{ dPt }}\">Revisão do Backoffice<\u002Fspan><span style=\"display:{{ dEn }}\">Backoffice Overhaul<\u002Fspan><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px;max-width:62ch\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O desafio<\u002Fspan><span style=\"display:{{ dEn }}\">The challenge<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">O backoffice apresentava esforço operacional elevado e retrabalho entre times, sem clareza de onde estavam os principais pontos de fricção.<\u002Fspan><span style=\"display:{{ dEn }}\">The backoffice had high operational effort and rework between teams, with no clarity on where the main friction points were.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Como conduzi<\u002Fspan><span style=\"display:{{ dEn }}\">How I ran it<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Mapeei os processos das áreas internas para entender como cada time atuava e quais dados usava — um exercício próximo de um service blueprint, conectando o que acontece nos bastidores (backstage) ao que impacta o cliente na ponta. Usei Figma e Miro para desenhar e validar os fluxos com as áreas envolvidas.<\u002Fspan><span style=\"display:{{ dEn }}\">I mapped internal teams' processes to understand how each one worked and which data it used — an exercise close to a service blueprint, connecting what happens backstage to what impacts the customer on the front end. I used Figma and Miro to design and validate the flows with the teams involved.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O resultado<\u002Fspan><span style=\"display:{{ dEn }}\">The result<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Reestruturei a arquitetura do backoffice para reduzir esforço operacional e eliminar redundâncias entre times, e apresentei o diagnóstico e a proposta para a liderança.<\u002Fspan><span style=\"display:{{ dEn }}\">I restructured the backoffice architecture to reduce operational effort and eliminate redundancies between teams, and presented the diagnosis and proposal to leadership.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;{{ railEdge }}\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Papel<\u002Fspan><span style=\"display:{{ dEn }}\">Role<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:14px\">Service Design<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Contexto<\u002Fspan><span style=\"display:{{ dEn }}\">Context<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1D5F6B\">Conta Simples<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #D3D2C6;padding-top:18px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E\"><span style=\"display:{{ dPt }}\">Impacto<\u002Fspan><span style=\"display:{{ dEn }}\">Impact<\u002Fspan><\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1\">↓ <span style=\"display:{{ dPt }}\">Esforço operacional<\u002Fspan><span style=\"display:{{ dEn }}\">Operational effort<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:13px;color:#565C60\"><span style=\"display:{{ dPt }}\">arquitetura do backoffice reestruturada para eliminar redundâncias entre times<\u002Fspan><span style=\"display:{{ dEn }}\">backoffice architecture restructured to eliminate redundancies between teams<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\">Service Design<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\">Service Blueprint<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\">Backstage / Frontstage<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\">Figma · Miro<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Apresentação executiva<\u002Fspan><span style=\"display:{{ dEn }}\">Executive presentation<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:40px;background:#FBFAF6;border:1px solid #D3D2C6\">\n        <svg sc-camel-view-box=\"0 0 800 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;width:100%;height:auto\">\n          <text x=\"20\" y=\"26\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#565C60\">FRONTSTAGE — visível ao cliente<\u002Ftext>\n          <rect x=\"20\" y=\"36\" width=\"760\" height=\"46\" rx=\"3\" fill=\"#F2E9D4\" stroke=\"#8A6A1E\"><\u002Frect>\n          <text x=\"400\" y=\"64\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12.5\" fill=\"#15181B\">Experiência do cliente — prazo, clareza e confiabilidade das operações financeiras<\u002Ftext>\n          <line x1=\"120\" y1=\"82\" x2=\"120\" y2=\"102\" stroke=\"#D3D2C6\" stroke-dasharray=\"3,3\"><\u002Fline>\n          <line x1=\"400\" y1=\"82\" x2=\"400\" y2=\"102\" stroke=\"#D3D2C6\" stroke-dasharray=\"3,3\"><\u002Fline>\n          <line x1=\"680\" y1=\"82\" x2=\"680\" y2=\"102\" stroke=\"#D3D2C6\" stroke-dasharray=\"3,3\"><\u002Fline>\n          <text x=\"20\" y=\"118\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#565C60\">BACKSTAGE — processos internos<\u002Ftext>\n          <rect x=\"20\" y=\"128\" width=\"200\" height=\"66\" rx=\"3\" fill=\"#E1EAEA\" stroke=\"#1D5F6B\"><\u002Frect>\n          <text x=\"120\" y=\"156\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Operação<\u002Ftext>\n          <text x=\"120\" y=\"174\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">dados e fluxos<\u002Ftext>\n          <rect x=\"300\" y=\"128\" width=\"200\" height=\"66\" rx=\"3\" fill=\"#E1EAEA\" stroke=\"#1D5F6B\"><\u002Frect>\n          <text x=\"400\" y=\"156\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Suporte<\u002Ftext>\n          <text x=\"400\" y=\"174\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">atendimento<\u002Ftext>\n          <rect x=\"580\" y=\"128\" width=\"200\" height=\"66\" rx=\"3\" fill=\"#E1EAEA\" stroke=\"#1D5F6B\"><\u002Frect>\n          <text x=\"680\" y=\"156\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Análise de risco<\u002Ftext>\n          <text x=\"680\" y=\"174\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">validação<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#565C60;padding:11px 16px;border-top:1px solid #D3D2C6\"><span style=\"display:{{ dPt }}\">Diagrama ilustrativo — blueprint simplificado (frontstage / backstage)<\u002Fspan><span style=\"display:{{ dEn }}\">Illustrative diagram — simplified blueprint (frontstage / backstage)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"case-6\" data-screen-label=\"Case 06\" style=\"padding:72px 0;border-top:1px solid #D3D2C6\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:8px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:0.8;color:#1D5F6B\">06<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#565C60\"><span style=\"display:{{ dPt }}\">IA na operação de research<\u002Fspan><span style=\"display:{{ dEn }}\">AI in the research operation<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }}\">\n        <div>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\"><span style=\"display:{{ dPt }}\">Operação de Pesquisa Potencializada por IA<\u002Fspan><span style=\"display:{{ dEn }}\">AI-Powered Research Operation<\u002Fspan><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px;max-width:62ch\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O que estruturei<\u002Fspan><span style=\"display:{{ dEn }}\">What I built<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Uma operação de pesquisa turbinada por IA de ponta a ponta: do recrutamento de participantes à disseminação de insights e documentação de dados.<\u002Fspan><span style=\"display:{{ dEn }}\">An end-to-end AI-powered research operation: from participant recruitment to insight distribution and data documentation.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Como conduzi<\u002Fspan><span style=\"display:{{ dEn }}\">How I ran it<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Construí skills do Claude para automatizar etapas do processo de research e workflows no n8n integrados ao Slack, criando uma esteira que reduz trabalho manual repetitivo e leva insights direto para onde as decisões acontecem.<\u002Fspan><span style=\"display:{{ dEn }}\">I built Claude skills to automate steps of the research process and n8n workflows integrated with Slack, creating a pipeline that cuts repetitive manual work and delivers insights straight to where decisions happen.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O resultado<\u002Fspan><span style=\"display:{{ dEn }}\">The result<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Apresentei o desenho dessa operação e seus ganhos de eficiência para a liderança — um trabalho de desenhar o próprio serviço de pesquisa, não só executá-lo.<\u002Fspan><span style=\"display:{{ dEn }}\">I presented this operation's design and its efficiency gains to leadership — a job of designing the research service itself, not just running it.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;{{ railEdge }}\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Papel<\u002Fspan><span style=\"display:{{ dEn }}\">Role<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:14px\"><span style=\"display:{{ dPt }}\">Liderança de UX Research, UX Writing &amp; CX<\u002Fspan><span style=\"display:{{ dEn }}\">UX Research, UX Writing &amp; CX Lead<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Contexto<\u002Fspan><span style=\"display:{{ dEn }}\">Context<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1D5F6B\">Conta Simples<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #D3D2C6;padding-top:18px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E\"><span style=\"display:{{ dPt }}\">Impacto<\u002Fspan><span style=\"display:{{ dEn }}\">Impact<\u002Fspan><\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1\">↓ <span style=\"display:{{ dPt }}\">Trabalho manual repetitivo<\u002Fspan><span style=\"display:{{ dEn }}\">Repetitive manual work<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:13px;color:#565C60\"><span style=\"display:{{ dPt }}\">esteira automatizada que leva insights direto para onde as decisões acontecem<\u002Fspan><span style=\"display:{{ dEn }}\">automated pipeline delivering insights straight to where decisions happen<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\">ResearchOps<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\"><span style=\"display:{{ dPt }}\">IA aplicada a research<\u002Fspan><span style=\"display:{{ dEn }}\">AI applied to research<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\"><span style=\"display:{{ dPt }}\">Automação de processos<\u002Fspan><span style=\"display:{{ dEn }}\">Process automation<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\">n8n · Slack · Claude<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Apresentação executiva<\u002Fspan><span style=\"display:{{ dEn }}\">Executive presentation<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:40px;background:#FBFAF6;border:1px solid #D3D2C6\">\n        <svg sc-camel-view-box=\"0 0 800 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;width:100%;height:auto\">\n          <rect x=\"15\" y=\"55\" width=\"170\" height=\"80\" rx=\"3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"100\" y=\"88\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Recrutamento<\u002Ftext>\n          <text x=\"100\" y=\"106\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">n8n<\u002Ftext>\n          <line x1=\"185\" y1=\"95\" x2=\"203\" y2=\"95\" stroke=\"#1D5F6B\" stroke-width=\"1.5\"><\u002Fline>\n          <polygon points=\"203,90 213,95 203,100\" fill=\"#1D5F6B\"><\u002Fpolygon>\n          <rect x=\"215\" y=\"55\" width=\"170\" height=\"80\" rx=\"3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"300\" y=\"88\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Execução<\u002Ftext>\n          <text x=\"300\" y=\"106\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">entrevistas · testes<\u002Ftext>\n          <line x1=\"385\" y1=\"95\" x2=\"403\" y2=\"95\" stroke=\"#1D5F6B\" stroke-width=\"1.5\"><\u002Fline>\n          <polygon points=\"403,90 413,95 403,100\" fill=\"#1D5F6B\"><\u002Fpolygon>\n          <rect x=\"415\" y=\"45\" width=\"180\" height=\"100\" rx=\"3\" fill=\"#E1EAEA\" stroke=\"#1D5F6B\"><\u002Frect>\n          <text x=\"505\" y=\"75\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Síntese de insights<\u002Ftext>\n          <rect x=\"440\" y=\"88\" width=\"130\" height=\"20\" rx=\"10\" fill=\"#FBFAF6\" stroke=\"#1D5F6B\"><\u002Frect>\n          <text x=\"505\" y=\"102\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#1D5F6B\">skill Claude<\u002Ftext>\n          <text x=\"505\" y=\"128\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">documentação automática<\u002Ftext>\n          <line x1=\"595\" y1=\"95\" x2=\"613\" y2=\"95\" stroke=\"#1D5F6B\" stroke-width=\"1.5\"><\u002Fline>\n          <polygon points=\"613,90 623,95 613,100\" fill=\"#1D5F6B\"><\u002Fpolygon>\n          <rect x=\"625\" y=\"55\" width=\"160\" height=\"80\" rx=\"3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"705\" y=\"88\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Distribuição<\u002Ftext>\n          <text x=\"705\" y=\"106\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">Slack<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#565C60;padding:11px 16px;border-top:1px solid #D3D2C6\"><span style=\"display:{{ dPt }}\">Diagrama ilustrativo — esteira de pesquisa com IA<\u002Fspan><span style=\"display:{{ dEn }}\">Illustrative diagram — AI-powered research pipeline<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"case-7\" data-screen-label=\"Case 07\" style=\"padding:72px 0;border-top:1px solid #D3D2C6\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:8px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:0.8;color:#1D5F6B\">07<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#565C60\"><span style=\"display:{{ dPt }}\">Esteira de desenvolvimento com agentes<\u002Fspan><span style=\"display:{{ dEn }}\">Agent-powered development pipeline<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }}\">\n        <div>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\"><span style=\"display:{{ dPt }}\">Concepção do SDLC<\u002Fspan><span style=\"display:{{ dEn }}\">Conceiving the SDLC<\u002Fspan><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px;max-width:62ch\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O que é<\u002Fspan><span style=\"display:{{ dEn }}\">What it is<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">O SDLC da Conta Simples: a esteira de desenvolvimento de produto construída sobre a metodologia de Triplo Diamante (Problema → Hipótese → Solução), com vocabulário comum entre áreas e artefatos rastreáveis de ponta a ponta, da iniciativa ao código.<\u002Fspan><span style=\"display:{{ dEn }}\">Conta Simples' SDLC: the product development pipeline built on the Triple Diamond methodology (Problem → Hypothesis → Solution), with shared vocabulary across teams and end-to-end traceable artifacts, from initiative to code.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Minha contribuição<\u002Fspan><span style=\"display:{{ dEn }}\">My contribution<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Em conjunto com o time de engenharia, traduzi parte das metodologias de design e pesquisa em skills de agentes de IA — geração de hipótese, prototipação, especificação de solução.<\u002Fspan><span style=\"display:{{ dEn }}\">Together with the engineering team, I translated part of the design and research methodologies into AI agent skills — hypothesis generation, prototyping, solution spec writing.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Qualidade sem perder velocidade<\u002Fspan><span style=\"display:{{ dEn }}\">Quality without losing speed<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Também desenhei guardrails de verificação nos gates do processo, acelerando etapas como validação e prototipagem sem abrir mão da qualidade — cada gate segue passando por revisão humana antes de avançar.<\u002Fspan><span style=\"display:{{ dEn }}\">I also designed verification guardrails at the process gates, speeding up steps like validation and prototyping without giving up quality — every gate still goes through human review before moving forward.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;{{ railEdge }}\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Papel<\u002Fspan><span style=\"display:{{ dEn }}\">Role<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:14px\"><span style=\"display:{{ dPt }}\">Trabalho conjunto — UX Research/Design &amp; Engenharia<\u002Fspan><span style=\"display:{{ dEn }}\">Joint effort — UX Research/Design &amp; Engineering<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Contexto<\u002Fspan><span style=\"display:{{ dEn }}\">Context<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1D5F6B\">Conta Simples<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #D3D2C6;padding-top:18px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E\"><span style=\"display:{{ dPt }}\">Impacto<\u002Fspan><span style=\"display:{{ dEn }}\">Impact<\u002Fspan><\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1\">↑ <span style=\"display:{{ dPt }}\">Velocidade com qualidade<\u002Fspan><span style=\"display:{{ dEn }}\">Speed with quality<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:13px;color:#565C60\"><span style=\"display:{{ dPt }}\">validação e prototipagem aceleradas, com revisão humana em cada gate do processo<\u002Fspan><span style=\"display:{{ dEn }}\">validation and prototyping accelerated, with human review at every process gate<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\"><span style=\"display:{{ dPt }}\">Metodologia &amp; Vocabulário<\u002Fspan><span style=\"display:{{ dEn }}\">Methodology &amp; Vocabulary<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\"><span style=\"display:{{ dPt }}\">Triplo Diamante<\u002Fspan><span style=\"display:{{ dEn }}\">Triple Diamond<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\"><span style=\"display:{{ dPt }}\">Skills de agentes de IA<\u002Fspan><span style=\"display:{{ dEn }}\">AI agent skills<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Guardrails de qualidade<\u002Fspan><span style=\"display:{{ dEn }}\">Quality guardrails<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:40px;background:#FBFAF6;border:1px solid #D3D2C6\">\n        <svg sc-camel-view-box=\"0 0 800 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;width:100%;height:auto\">\n          <polygon points=\"130,30 220,110 130,190 40,110\" fill=\"#E1EAEA\" stroke=\"#1D5F6B\"><\u002Fpolygon>\n          <text x=\"130\" y=\"106\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"13\" fill=\"#15181B\">Problema<\u002Ftext>\n          <text x=\"130\" y=\"124\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">explorar · priorizar<\u002Ftext>\n          <rect x=\"235\" y=\"100\" width=\"60\" height=\"20\" rx=\"10\" fill=\"#FBFAF6\" stroke=\"#8A6A1E\"><\u002Frect>\n          <text x=\"265\" y=\"114\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"#8A6A1E\">gate<\u002Ftext>\n          <polygon points=\"400,30 490,110 400,190 310,110\" fill=\"#E1EAEA\" stroke=\"#1D5F6B\"><\u002Fpolygon>\n          <text x=\"400\" y=\"106\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"13\" fill=\"#15181B\">Hipótese<\u002Ftext>\n          <text x=\"400\" y=\"124\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">levantar · validar<\u002Ftext>\n          <rect x=\"505\" y=\"100\" width=\"60\" height=\"20\" rx=\"10\" fill=\"#FBFAF6\" stroke=\"#8A6A1E\"><\u002Frect>\n          <text x=\"535\" y=\"114\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"#8A6A1E\">gate<\u002Ftext>\n          <polygon points=\"670,30 760,110 670,190 580,110\" fill=\"#E1EAEA\" stroke=\"#1D5F6B\"><\u002Fpolygon>\n          <text x=\"670\" y=\"106\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"13\" fill=\"#15181B\">Solução<\u002Ftext>\n          <text x=\"670\" y=\"124\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">refinar · construir<\u002Ftext>\n          <rect x=\"100\" y=\"196\" width=\"620\" height=\"20\" rx=\"10\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"410\" y=\"210\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">skills de agente apoiando cada etapa · revisão humana em cada gate<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#565C60;padding:11px 16px;border-top:1px solid #D3D2C6\"><span style=\"display:{{ dPt }}\">Diagrama ilustrativo — Triplo Diamante do SDLC<\u002Fspan><span style=\"display:{{ dEn }}\">Illustrative diagram — SDLC Triple Diamond<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"case-8\" data-screen-label=\"Case 08\" style=\"padding:72px 0;border-top:1px solid #D3D2C6\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:8px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:0.8;color:#8A6A1E\">08<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#565C60\"><span style=\"display:{{ dPt }}\">Discovery estratégico B2B<\u002Fspan><span style=\"display:{{ dEn }}\">B2B strategic discovery<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }}\">\n        <div>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\"><span style=\"display:{{ dPt }}\">Jornadas de Relacionamento em Gestão de Frotas<\u002Fspan><span style=\"display:{{ dEn }}\">Fleet Management Relationship Journeys<\u002Fspan><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px;max-width:62ch\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O desafio<\u002Fspan><span style=\"display:{{ dEn }}\">The challenge<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Entender a perspectiva de gestores de frota sobre o relacionamento com a empresa contratante, mapear as principais jornadas desse relacionamento e transformar isso em oportunidades estratégicas de produto.<\u002Fspan><span style=\"display:{{ dEn }}\">Understand fleet managers' perspective on their relationship with the contracting company, map the key journeys within that relationship, and turn this into strategic product opportunities.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Como conduzi<\u002Fspan><span style=\"display:{{ dEn }}\">How I ran it<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Liderei a pesquisa de ponta a ponta: retomada do briefing, definição de premissas, mapeamento de três jornadas-chave (troca de carro provisório, aquisição de carro novo, geração de relatórios), identificação de pontos de atrito ao longo dessas jornadas, e construção de um mapa de valor a partir de entrevistas com gestores de frota.<\u002Fspan><span style=\"display:{{ dEn }}\">I led the research end-to-end: briefing review, defining premises, mapping three key journeys (temporary car swap, new car acquisition, report generation), identifying friction points along these journeys, and building a value map from interviews with fleet managers.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O resultado<\u002Fspan><span style=\"display:{{ dEn }}\">The result<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Entreguei recomendações e oportunidades estratégicas organizadas por eixos (automação, integração, antecipação, visibilidade, sustentabilidade), traduzindo a pesquisa em direcionamento de produto para uma grande empresa de gestão de frotas no Brasil, atendida pela consultoria No One.<\u002Fspan><span style=\"display:{{ dEn }}\">I delivered recommendations and strategic opportunities organized by theme (automation, integration, anticipation, visibility, sustainability), translating research into product direction for a large fleet management company in Brazil, served by the No One consultancy.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;{{ railEdge }}\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Papel<\u002Fspan><span style=\"display:{{ dEn }}\">Role<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:14px\"><span style=\"display:{{ dPt }}\">Liderança de pesquisa<\u002Fspan><span style=\"display:{{ dEn }}\">Research Lead<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Contexto<\u002Fspan><span style=\"display:{{ dEn }}\">Context<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A6A1E\"><span style=\"display:{{ dPt }}\">No One (consultoria)<\u002Fspan><span style=\"display:{{ dEn }}\">No One (consultancy)<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #D3D2C6;padding-top:18px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E\"><span style=\"display:{{ dPt }}\">Impacto<\u002Fspan><span style=\"display:{{ dEn }}\">Impact<\u002Fspan><\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1\"><span style=\"display:{{ dPt }}\">3 jornadas · 5 eixos<\u002Fspan><span style=\"display:{{ dEn }}\">3 journeys · 5 themes<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:13px;color:#565C60\"><span style=\"display:{{ dPt }}\">jornadas-chave mapeadas e oportunidades estratégicas organizadas por eixo, traduzidas em direcionamento de produto<\u002Fspan><span style=\"display:{{ dEn }}\">key journeys mapped and strategic opportunities organized by theme, translated into product direction<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Discovery estratégico<\u002Fspan><span style=\"display:{{ dEn }}\">Strategic discovery<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Jornada B2B<\u002Fspan><span style=\"display:{{ dEn }}\">B2B journey<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Mapa de atritos<\u002Fspan><span style=\"display:{{ dEn }}\">Friction map<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\"><span style=\"display:{{ dPt }}\">Contexto operacional complexo<\u002Fspan><span style=\"display:{{ dEn }}\">Complex operational context<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:40px;background:#FBFAF6;border:1px solid #D3D2C6\">\n        <svg sc-camel-view-box=\"0 0 800 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;width:100%;height:auto\">\n          <rect x=\"15\" y=\"20\" width=\"185\" height=\"50\" rx=\"3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"107\" y=\"41\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"11\" fill=\"#15181B\">Jornada 1<\u002Ftext>\n          <text x=\"107\" y=\"58\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">Carro provisório<\u002Ftext>\n          <rect x=\"15\" y=\"85\" width=\"185\" height=\"50\" rx=\"3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"107\" y=\"106\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"11\" fill=\"#15181B\">Jornada 2<\u002Ftext>\n          <text x=\"107\" y=\"123\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">Carro novo<\u002Ftext>\n          <rect x=\"15\" y=\"150\" width=\"185\" height=\"50\" rx=\"3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"107\" y=\"171\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"11\" fill=\"#15181B\">Jornada 3<\u002Ftext>\n          <text x=\"107\" y=\"188\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">Relatórios<\u002Ftext>\n          <line x1=\"200\" y1=\"110\" x2=\"228\" y2=\"110\" stroke=\"#8A6A1E\" stroke-width=\"1.5\"><\u002Fline>\n          <polygon points=\"228,105 238,110 228,115\" fill=\"#8A6A1E\"><\u002Fpolygon>\n          <rect x=\"240\" y=\"55\" width=\"220\" height=\"110\" rx=\"3\" fill=\"#E1EAEA\" stroke=\"#1D5F6B\"><\u002Frect>\n          <text x=\"350\" y=\"88\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12.5\" fill=\"#15181B\">Mapa de Atritos<\u002Ftext>\n          <text x=\"350\" y=\"106\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12.5\" fill=\"#15181B\">&amp; Mapa de Valor<\u002Ftext>\n          <text x=\"350\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">entrevistas com<\u002Ftext>\n          <text x=\"350\" y=\"144\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">gestores de frota<\u002Ftext>\n          <line x1=\"460\" y1=\"110\" x2=\"488\" y2=\"110\" stroke=\"#8A6A1E\" stroke-width=\"1.5\"><\u002Fline>\n          <polygon points=\"488,105 498,110 488,115\" fill=\"#8A6A1E\"><\u002Fpolygon>\n          <rect x=\"510\" y=\"35\" width=\"275\" height=\"150\" rx=\"3\" fill=\"#F2E9D4\" stroke=\"#8A6A1E\"><\u002Frect>\n          <text x=\"647\" y=\"62\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12.5\" fill=\"#15181B\">Recomendações estratégicas<\u002Ftext>\n          <text x=\"647\" y=\"92\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#6E5314\">Automação<\u002Ftext>\n          <text x=\"647\" y=\"112\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#6E5314\">Integração<\u002Ftext>\n          <text x=\"647\" y=\"132\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#6E5314\">Antecipação<\u002Ftext>\n          <text x=\"647\" y=\"152\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#6E5314\">Visibilidade<\u002Ftext>\n          <text x=\"647\" y=\"172\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#6E5314\">Sustentabilidade<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#565C60;padding:11px 16px;border-top:1px solid #D3D2C6\"><span style=\"display:{{ dPt }}\">Diagrama ilustrativo — de jornadas mapeadas a oportunidades estratégicas<\u002Fspan><span style=\"display:{{ dEn }}\">Illustrative diagram — from mapped journeys to strategic opportunities<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"case-9\" data-screen-label=\"Case 09\" style=\"padding:72px 0;border-top:1px solid #D3D2C6\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:8px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:0.8;color:#8A6A1E\">09<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#565C60\"><span style=\"display:{{ dPt }}\">Jornada em ambiente regulado<\u002Fspan><span style=\"display:{{ dEn }}\">Journey in a regulated environment<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }}\">\n        <div>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\"><span style=\"display:{{ dPt }}\">Mapeamento da Jornada do Paciente<\u002Fspan><span style=\"display:{{ dEn }}\">Patient Journey Mapping<\u002Fspan><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px;max-width:62ch\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O desafio<\u002Fspan><span style=\"display:{{ dEn }}\">The challenge<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Entender a experiência de pacientes e familiares ao longo da jornada hospitalar, em um ambiente de alta complexidade operacional e regulatória, para orientar melhorias de experiência com base em evidência.<\u002Fspan><span style=\"display:{{ dEn }}\">Understand patients' and family members' experience throughout the hospital journey, in an environment of high operational and regulatory complexity, to guide evidence-based experience improvements.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Como conduzi<\u002Fspan><span style=\"display:{{ dEn }}\">How I ran it<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Liderei a pesquisa de ponta a ponta: retomada de briefing, imersão no cenário e universo do projeto, shadowing com equipes assistenciais (enfermagem, concierge) e entrevistas com pacientes e familiares, construção de perfis e experience goals, e mapeamento das jornadas com seus principais pontos de atrito.<\u002Fspan><span style=\"display:{{ dEn }}\">I led the research end-to-end: briefing review, immersion into the project's scenario and context, shadowing with care teams (nursing, concierge) and interviews with patients and family members, building profiles and experience goals, and mapping journeys with their key friction points.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O resultado<\u002Fspan><span style=\"display:{{ dEn }}\">The result<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Entreguei uma estratégia e recomendações priorizadas para um grande hospital de referência no Brasil, atendido pela consultoria No One, traduzindo observação de campo e entrevistas em direcionamento concreto de experiência do paciente.<\u002Fspan><span style=\"display:{{ dEn }}\">I delivered a prioritized strategy and recommendations for a major reference hospital in Brazil, served by the No One consultancy, translating field observation and interviews into concrete patient experience direction.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;{{ railEdge }}\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Papel<\u002Fspan><span style=\"display:{{ dEn }}\">Role<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:14px\"><span style=\"display:{{ dPt }}\">Liderança de pesquisa<\u002Fspan><span style=\"display:{{ dEn }}\">Research Lead<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Contexto<\u002Fspan><span style=\"display:{{ dEn }}\">Context<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A6A1E\"><span style=\"display:{{ dPt }}\">No One (consultoria)<\u002Fspan><span style=\"display:{{ dEn }}\">No One (consultancy)<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #D3D2C6;padding-top:18px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E\"><span style=\"display:{{ dPt }}\">Impacto<\u002Fspan><span style=\"display:{{ dEn }}\">Impact<\u002Fspan><\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1\"><span style=\"display:{{ dPt }}\">Estratégia entregue<\u002Fspan><span style=\"display:{{ dEn }}\">Strategy delivered<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:13px;color:#565C60\"><span style=\"display:{{ dPt }}\">recomendações priorizadas de experiência do paciente, a partir de observação de campo e entrevistas<\u002Fspan><span style=\"display:{{ dEn }}\">prioritized patient experience recommendations, built from field observation and interviews<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Shadowing / Etnografia<\u002Fspan><span style=\"display:{{ dEn }}\">Shadowing / Ethnography<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Jornada do paciente<\u002Fspan><span style=\"display:{{ dEn }}\">Patient journey<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Perfis &amp; Experience Goals<\u002Fspan><span style=\"display:{{ dEn }}\">Profiles &amp; Experience Goals<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\"><span style=\"display:{{ dPt }}\">Ambiente regulado<\u002Fspan><span style=\"display:{{ dEn }}\">Regulated environment<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:40px;background:#FBFAF6;border:1px solid #D3D2C6\">\n        <svg sc-camel-view-box=\"0 0 800 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;width:100%;height:auto\">\n          <rect x=\"15\" y=\"55\" width=\"165\" height=\"80\" rx=\"3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"97\" y=\"88\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Imersão<\u002Ftext>\n          <text x=\"97\" y=\"106\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">cenário &amp; briefing<\u002Ftext>\n          <line x1=\"180\" y1=\"95\" x2=\"198\" y2=\"95\" stroke=\"#8A6A1E\" stroke-width=\"1.5\"><\u002Fline>\n          <polygon points=\"198,90 208,95 198,100\" fill=\"#8A6A1E\"><\u002Fpolygon>\n          <rect x=\"210\" y=\"55\" width=\"180\" height=\"80\" rx=\"3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"300\" y=\"88\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Shadowing<\u002Ftext>\n          <text x=\"300\" y=\"106\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">equipe assistencial<\u002Ftext>\n          <line x1=\"390\" y1=\"95\" x2=\"408\" y2=\"95\" stroke=\"#8A6A1E\" stroke-width=\"1.5\"><\u002Fline>\n          <polygon points=\"408,90 418,95 408,100\" fill=\"#8A6A1E\"><\u002Fpolygon>\n          <rect x=\"420\" y=\"55\" width=\"180\" height=\"80\" rx=\"3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"510\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Entrevistas<\u002Ftext>\n          <text x=\"510\" y=\"98\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">pacientes &amp;<\u002Ftext>\n          <text x=\"510\" y=\"112\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">familiares<\u002Ftext>\n          <line x1=\"600\" y1=\"95\" x2=\"618\" y2=\"95\" stroke=\"#8A6A1E\" stroke-width=\"1.5\"><\u002Fline>\n          <polygon points=\"618,90 628,95 618,100\" fill=\"#8A6A1E\"><\u002Fpolygon>\n          <rect x=\"630\" y=\"40\" width=\"155\" height=\"110\" rx=\"3\" fill=\"#F2E9D4\" stroke=\"#8A6A1E\"><\u002Frect>\n          <text x=\"707\" y=\"70\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Jornada &amp;<\u002Ftext>\n          <text x=\"707\" y=\"88\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"12\" fill=\"#15181B\">Estratégia<\u002Ftext>\n          <rect x=\"655\" y=\"100\" width=\"105\" height=\"20\" rx=\"10\" fill=\"#FBFAF6\" stroke=\"#8A6A1E\"><\u002Frect>\n          <text x=\"707\" y=\"114\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"#6E5314\">recomendações<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#565C60;padding:11px 16px;border-top:1px solid #D3D2C6\"><span style=\"display:{{ dPt }}\">Diagrama ilustrativo — da imersão em campo à estratégia de experiência<\u002Fspan><span style=\"display:{{ dEn }}\">Illustrative diagram — from field immersion to experience strategy<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"border-top:1px solid #D3D2C6;padding:56px 0 88px;display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }};align-items:start\">\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.75;color:#565C60;margin:0;max-width:62ch\"><span style=\"display:{{ dPt }}\">Cases conduzidos ao longo da minha trajetória profissional em UX Research, Service Design, ResearchOps e CX — incluindo passagens pela Conta Simples e por projetos de consultoria em pesquisa estratégica B2B. Contato disponível mediante solicitação.<\u002Fspan><span style=\"display:{{ dEn }}\">Case studies from across my professional trajectory in UX Research, Service Design, ResearchOps, and CX — including work at Conta Simples and strategic B2B research consulting projects. Contact available upon request.<\u002Fspan><\u002Fp>\n      <div style=\"{{ railEdge }}\">\n        <div style=\"font-family:'Instrument Serif',serif;font-size:22px;margin-bottom:12px\">Ingrid Humia<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#565C60\">\n          <span><span style=\"display:{{ dPt }}\">WhatsApp/Celular: 51 98533-3351<\u002Fspan><span style=\"display:{{ dEn }}\">WhatsApp/Mobile: +55 51 98533-3351<\u002Fspan><\u002Fspan>\n          <a href=\"mailto:ing.humia@gmail.com\" style=\"color:#1D5F6B;text-decoration:none;border-bottom:1px solid #D3D2C6;align-self:flex-start\">ing.humia@gmail.com<\u002Fa>\n          <a href=\"https://www.linkedin.com/in/ingridhumia\" target=\"_blank\" rel=\"noopener\" style=\"color:#1D5F6B;text-decoration:none;border-bottom:1px solid #D3D2C6;align-self:flex-start\">linkedin.com/in/ingridhumia<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;initialLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pt&quot;,&quot;en&quot;],&quot;default&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;'pt' | 'en'&quot;},&quot;showIndex&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { lang: null, w: typeof window !== 'undefined' ? (document.documentElement.clientWidth || window.innerWidth) : 1200 };\n  get lang(){ return this.state.lang || this.props.initialLang || 'pt'; }\n  componentDidMount(){\n    document.documentElement.lang = this.lang === 'en' ? 'en' : 'pt-BR';\n    this.onResize = () => {\n      if(this.raf) cancelAnimationFrame(this.raf);\n      this.raf = requestAnimationFrame(() => {\n        const w = document.documentElement.clientWidth || window.innerWidth;\n        if(w !== this.state.w) this.setState({ w });\n      });\n    };\n    window.addEventListener('resize', this.onResize);\n    this.ro = new ResizeObserver(this.onResize);\n    this.ro.observe(document.documentElement);\n    this.onResize();\n  }\n  componentWillUnmount(){\n    window.removeEventListener('resize', this.onResize);\n    if(this.ro) this.ro.disconnect();\n    if(this.raf) cancelAnimationFrame(this.raf);\n  }\n  setLang(lang){\n    document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR';\n    this.setState({ lang });\n  }\n  renderVals(){\n    const lang = this.lang;\n    const narrow = (this.state.w || 1200) <= 860;\n    const btn = (active) => `appearance:none;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:inherit;letter-spacing:inherit;padding:7px 13px;background:${active ? '#1D5F6B' : 'transparent'};color:${active ? '#FBFAF6' : '#1D5F6B'}`;\n    return {\n      dPt: lang === 'pt' ? 'inline' : 'none',\n      dEn: lang === 'en' ? 'inline' : 'none',\n      ptBtn: btn(lang === 'pt'),\n      enBtn: btn(lang === 'en'),\n      cols: narrow ? 'minmax(0,1fr)' : 'minmax(0,1.55fr) minmax(0,1fr)',\n      colGap: narrow ? '32px' : '56px',\n      railEdge: narrow ? 'border-top:1px solid #D3D2C6;padding-top:24px' : 'border-left:1px solid #D3D2C6;padding-left:28px',\n      indexDisplay: (this.props.showIndex ?? true) ? 'block' : 'none',\n      setPt: () => this.setLang('pt'),\n      setEn: () => this.setLang('en')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
