document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ont-size:14px\"><span style=\"display:{{ dPt }}\">Mapeamento da Jornada do Paciente<\u002Fspan><span style=\"display:{{ dEn }}\">Patient Journey Mapping<\u002Fspan><span style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#565C60;margin-top:5px\"><span style=\"display:{{ dPt }}\">Jornada em ambiente regulado<\u002Fspan><span style=\"display:{{ dEn }}\">Journey in a regulated environment<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <section id=\"case-1\" data-screen-label=\"Case 01\" style=\"padding:72px 0;border-top:1px solid #D3D2C6;margin-top:36px\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:8px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:0.8;color:#1D5F6B\">01<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#565C60\"><span style=\"display:{{ dPt }}\">Inteligência competitiva com IA<\u002Fspan><span style=\"display:{{ dEn }}\">AI-powered competitive intelligence<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }}\">\n        <div>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\"><span style=\"display:{{ dPt }}\">IDP — Índice de Diferenciação de Produto<\u002Fspan><span style=\"display:{{ dEn }}\">IDP — Product Differentiation Index<\u002Fspan><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px;max-width:62ch\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O modelo<\u002Fspan><span style=\"display:{{ dEn }}\">The model<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Criei o IDP, um modelo que mede as capacidades do produto Conta Simples e compara com as dos concorrentes (Clara, Jeeves e Stark Bank), gerando um score ponderado de paridade competitiva.<\u002Fspan><span style=\"display:{{ dEn }}\">I created the IDP, a model that measures Conta Simples' product capabilities against competitors (Clara, Jeeves and Stark Bank), generating a weighted competitive parity score.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">De processo manual a agente de IA<\u002Fspan><span style=\"display:{{ dEn }}\">From manual process to AI agent<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Transformei esse processo em uma skill de agente de IA que automatiza a varredura mensal dos concorrentes, atualiza o scorecard e distribui os insights entre produto, vendas e sucesso do cliente.<\u002Fspan><span style=\"display:{{ dEn }}\">I turned this process into an AI agent skill that automates the monthly competitor scan, updates the scorecard, and distributes insights across product, sales, and customer success.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Como conduzi<\u002Fspan><span style=\"display:{{ dEn }}\">How I ran it<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Facilitei workshops com essas áreas para validar os critérios de scoring e apresentei os resultados e o racional do modelo para a liderança.<\u002Fspan><span style=\"display:{{ dEn }}\">I facilitated workshops with these teams to validate the scoring criteria and presented the results and the model's rationale to leadership.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;{{ railEdge }}\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Papel<\u002Fspan><span style=\"display:{{ dEn }}\">Role<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:14px\"><span style=\"display:{{ dPt }}\">Liderança de UX Research, UX Writing &amp; CX<\u002Fspan><span style=\"display:{{ dEn }}\">UX Research, UX Writing &amp; CX Lead<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Contexto<\u002Fspan><span style=\"display:{{ dEn }}\">Context<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1D5F6B\">Conta Simples<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #D3D2C6;padding-top:18px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E\"><span style=\"display:{{ dPt }}\">Impacto<\u002Fspan><span style=\"display:{{ dEn }}\">Impact<\u002Fspan><\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1\">↑ <span style=\"display:{{ dPt }}\">Inteligência recorrente<\u002Fspan><span style=\"display:{{ dEn }}\">Recurrin "3\" fill=\"none\" stroke=\"#D3D2C6\"><\u002Frect>\n          <text x=\"530\" y=\"254\" font-family=\"Archivo\" font-size=\"12.5\" fill=\"#15181B\">Sucesso do Cliente<\u002Ftext>\n          <text x=\"530\" y=\"274\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">atritos que podem acontecer no<\u002Ftext>\n          <text x=\"530\" y=\"290\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">onboarding do cliente<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#565C60;padding:11px 16px;border-top:1px solid #D3D2C6\"><span style=\"display:{{ dPt }}\">Diagrama ilustrativo — fluxo do IDP, exemplo de score e entrega por área<\u002Fspan><span style=\"display:{{ dEn }}\">Illustrative diagram — IDP flow, example score and delivery per team<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"case-2\" data-screen-label=\"Case 02\" style=\"padding:72px 0;border-top:1px solid #D3D2C6\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:8px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:0.8;color:#1D5F6B\">02<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#565C60\"><span style=\"display:{{ dPt }}\">Arquitetura de organização, usuários e permissões<\u002Fspan><span style=\"display:{{ dEn }}\">Organization, users &amp; permissions architecture<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }}\">\n        <div>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\"><span style=\"display:{{ dPt }}\">Centro de Custo, Usuários e Permissões<\u002Fspan><span style=\"display:{{ dEn }}\">Cost Center, Users &amp; Permissions<\u002Fspan><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px;max-width:62ch\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O desafio<\u002Fspan><span style=\"display:{{ dEn }}\">The challenge<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Mimetizar a estrutura organizacional real de cada empresa cliente dentro da plataforma — fazendo com que trouxessem mais dados operacionais para a Conta Simples e gerando maior lock-in.<\u002Fspan><span style=\"display:{{ dEn }}\">Mirror each client company's real organizational structure inside the platform — leading them to bring more operational data into Conta Simples and generating greater lock-in.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Como conduzi<\u002Fspan><span style=\"display:{{ dEn }}\">How I ran it<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Conduzi a descoberta e o desenho da relação entre centro de custo, usuários e permissões, combinando entrevistas em profundidade, testes de conceito, surveys em etapas-chave do produto, conversas com os times de vendas e sucesso do cliente, e testes de protótipo.<\u002Fspan><span style=\"display:{{ dEn }}\">I led the discovery and design of the relationship between cost center, users, and permissions, combining in-depth interviews, concept tests, surveys at key product moments, conversations with sales and customer success teams, and prototype testing.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O resultado<\u002Fspan><span style=\"display:{{ dEn }}\">The result<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">O desenho virou a estrutura atual do produto, hoje disponível na área de Organização.<\u002Fspan><span style=\"display:{{ dEn }}\">The design became the product's current structure, now live in the Organization area.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;{{ railEdge }}\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Papel<\u002Fspan><span style=\"display:{{ dEn }}\">Role<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:14px\"><span style=\"display:{{ dPt }}\">Liderança de UX Research, UX Writing &amp; CX<\u002Fspan><span style=\"display:{{ dEn }}\">UX Research, UX Writing &amp; CX Lead<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Contexto<\u002Fspan><span style=\"display:{{ dEn }}\">Context<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1D5F6B\">Conta Simples<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #D3D2C6;padding-top:18px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;colo ospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\"><span style=\"display:{{ dPt }}\">Teste de conceito<\u002Fspan><span style=\"display:{{ dEn }}\">Concept test<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\">Survey<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#E1EAEA;color:#12464F\"><span style=\"display:{{ dPt }}\">Teste de protótipo<\u002Fspan><span style=\"display:{{ dEn }}\">Prototype test<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;background:#F2E9D4;color:#6E5314\"><span style=\"display:{{ dPt }}\">Lock-in / retenção<\u002Fspan><span style=\"display:{{ dEn }}\">Lock-in / retention<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:40px;background:#FBFAF6;border:1px solid #D3D2C6\">\n        <svg sc-camel-view-box=\"0 0 800 420\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Mockup fictício da área de Organização\" style=\"display:block;width:100%;height:auto\">\n          <rect x=\"0\" y=\"0\" width=\"800\" height=\"420\" fill=\"#FBFAF6\"><\u002Frect>\n          <rect x=\"24\" y=\"24\" width=\"752\" height=\"372\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D3D2C6\"><\u002Frect>\n\n          <rect x=\"24\" y=\"24\" width=\"168\" height=\"372\" fill=\"#F4F2EC\"><\u002Frect>\n          <line x1=\"192\" y1=\"24\" x2=\"192\" y2=\"396\" stroke=\"#D3D2C6\"><\u002Fline>\n          <circle cx=\"48\" cy=\"52\" r=\"8\" fill=\"#1D5F6B\"><\u002Fcircle>\n          <rect x=\"64\" y=\"47\" width=\"72\" height=\"9\" rx=\"2\" fill=\"#C9CCC4\"><\u002Frect>\n          <text x=\"44\" y=\"94\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" letter-spacing=\"1\" fill=\"#565C60\">ORGANIZAR<\u002Ftext>\n          <rect x=\"34\  Plex Mono\" font-size=\"9.5\" letter-spacing=\"0.8\" fill=\"#565C60\">PERMISSÃO<\u002Ftext>\n\n          <rect x=\"216\" y=\"128\" width=\"538\" height=\"56\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#E4E3DC\"><\u002Frect>\n          <text x=\"236\" y=\"152\" font-family=\"Archivo\" font-size=\"12.5\" fill=\"#15181B\">Comercial<\u002Ftext>\n          <text x=\"236\" y=\"170\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">12 cartões · limite R$ 80 mil<\u002Ftext>\n          <circle cx=\"482\" cy=\"156\" r=\"10\" fill=\"#E1EAEA\"><\u002Fcircle>\n          <circle cx=\"498\" cy=\"156\" r=\"10\" fill=\"#E1EAEA\"><\u002Fcircle>\n          <circle cx=\"514\" cy=\"156\" r=\"10\" fill=\"#F2E9D4\"><\u002Fcircle>\n          <text x=\"536\" y=\"160\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">+9<\u002Ftext>\n          <rect x=\"606\" y=\"146\" width=\"96\" height=\"20\" rx=\"10\" fill=\"#E1EAEA\"><\u002Frect>\n          <text x=\"654\" y=\"160\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#12464F\">gestor<\u002Ftext>\n\n          <rect x=\"216\" y=\"192\" width=\"538\" height=\"56\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#E4E3DC\"><\u002Frect>\n          <text x=\"236\" y=\"216\" font-family=\"Archivo\" font-size=\"12.5\" fill=\"#15181B\">Operações<\u002Ftext>\n          <text x=\"236\" y=\"234\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">8 cartões · limite R$ 45 mil<\u002Ftext>\n          <circle cx=\"482\" cy=\"220\" r=\"10\" fill=\"#E1EAEA\"><\u002Fcircle>\n          <circle cx=\"498\" cy=\"220\" r=\"10\" fill=\"#E1EAEA\"><\u002Fcircle>\n          <text x=\"520\" y=\"224\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">+6<\u002Ftext>\n          <rect x=\"606\" y=\"210\" width=\"96\" height=\"20\" rx=\"10\" fill=\"#E1EAEA\"><\u002Frect>\n          <text x=\"654\" y=\"224\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#12464F\">aprovador<\u002Ftext>\n\n          <rect x=\"216\" y=\"256\" width=\"538\" height=\"56\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#E4E3DC\"><\u002Frect>\n          <text x=\"236\" y=\"280\" font-family=\"Archivo\" font-size=\"12.5\" fill=\"#15181B\">Marketing<\u002Ftext>\n          <text x=\"236\" y=\"298\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">5 cartões · limite R$ 30 mil<\u002Ftext>\n          <circle cx=\"482\" cy=\"284\" r=\"10\" fill=\"#E1EAEA\"><\u002Fcircle>\n          <circle cx=\"498\" cy=\"284\" r=\"10\" fill=\"#E1EAEA\"><\u002Fcircle>\n          <text x=\"520\" y=\"288\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">+3<\u002Ftext>\n          <rect x=\"606\" y=\"274\" width=\"96\" height=\"20\" rx=\"10\" fill=\"#F2E9D4\"><\u002Frect>\n          <text x=\"654\" y=\"288\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#6E5314\">portador<\u002Ftext>\n\n          <rect x=\"216\" y=\"320\" width=\"538\" height=\"56\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#E4E3DC\" stroke-dasharray=\"4,3\"><\u002Frect>\n          <text x=\"236\" y=\"344\" font-family=\"Archivo\" font-size=\"12.5\" fill=\"#565C60\">Filial Sul<\u002Ftext>\n          <text x=\"236\" y=\"362\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">herda estrutura de Operações<\u002Ftext>\n          <text x=\"606\" y=\"354\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#565C60\">definir permissões<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#565C60;padding:11px 16px;border-top:1px solid #D3D2C6\"><span style=\"display:{{ dPt }}\">Mockup fictício — centros de custo com usuários e permissões vinculados<\u002Fspan><span style=\"display:{{ dEn }}\">Fictional mockup — cost centers with linked users and permissions<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"case-3\" data-screen-label=\"Case 03\" style=\"padding:72px 0;border-top:1px solid #D3D2C6\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:8px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:0.8;color:#1D5F6B\">03<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#565C60\"><span style=\"display:{{ dPt }}\">Discovery a delivery<\u002Fspan><span style=\"display:{{ dEn }}\">Discovery to delivery<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }}\">\n        <div>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\"><span style=\"display:{{ dPt }}\">Políticas de Gasto<\u002Fspan><span style=\"display:{{ dEn }}\">Spend Policies<\u002Fspan><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px;max-width:62ch\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O desafio<\u002Fspan><span style=\"display:{{ dEn }}\">The challenge<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Entender os critérios usados por clientes e não clientes na aprovação ou reprovação de uma despesa, gerando os insumos para o lançamento da feature de Políticas de Gasto.<\u002Fspan><span style=\"display:{{ dEn }}\">Understand the criteria customers and non-customers use to approve or reject an expense, generating the inputs for launching the Spend Policies feature.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Como conduzi<\u002Fspan><span style=\"display:{{ dEn }}\">How I ran it<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Mapeei a jornada e conduzi o processo de ponta a ponta — exploração, teste de conceito, teste de protótipo em alta fidelidade em Figma, workshops com stakeholders de produto e negócio — trabalhando lado a lado com o time de PMM na construção do GTM.<\u002Fspan><span style=\"display:{{ dEn }}\">I mapped the journey and led the process end-to-end — exploration, concept testing, high-fidelity prototype testing in Figma, workshops with product and business stakeholders — working side by side with the PMM team on the go-to-market.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O resultado<\u002Fspan><span style=\"display:{{ dEn }}\">The result<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Apresentei os resultados para a liderança e mantive o acompanhamento dos KPIs pós-lançamento (nº de políticas criadas por empresa, taxa de sucesso de transações negadas/limitadas por política).<\u002Fspan><span style=\"display:{{ dEn }}\">I presented the results to leadership and tracked post-launch KPIs (number of policies created per company, success rate of transactions declined/limited by policy).<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <a href=\"https://contasimples.com/gestao-despesas\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#15181B;text-decoration:none;border-bottom:1px solid #1D5F6B;align-self:flex-start;padding-bottom:2px\">contasimples.com/gestao-despesas ↗<\u002Fa>\n se 04\" style=\"padding:72px 0;border-top:1px solid #D3D2C6\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:8px\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:0.8;color:#1D5F6B\">04<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#565C60\"><span style=\"display:{{ dPt }}\">Arquitetura de serviço<\u002Fspan><span style=\"display:{{ dEn }}\">Service architecture<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ cols }};gap:{{ colGap }}\">\n        <div>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\"><span style=\"display:{{ dPt }}\">Reestruturação da Arquitetura de Informação<\u002Fspan><span style=\"display:{{ dEn }}\">Information Architecture Redesign<\u002Fspan><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px;max-width:62ch\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">O desafio<\u002Fspan><span style=\"display:{{ dEn }}\">The challenge<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">A navegação do produto refletia a estrutura interna do sistema, não o modelo mental do cliente na gestão financeira do dia a dia.<\u002Fspan><span style=\"display:{{ dEn }}\">The product's navigation reflected the system's internal structure, not the customer's mental model of day-to-day financial management.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">Como conduzi<\u002Fspan><span style=\"display:{{ dEn }}\">How I ran it<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Mapeei as principais etapas da jornada real de gestão financeira das empresas e reorganizei as features em torno delas — Organizar, Movimentar e Acompanhar. Usei Miro para o mapeamento colaborativo dos fluxos e Figma para validar a nova estrutura de navegação.<\u002Fspan><span style=\"display:{{ dEn }}\">I mapped the key stages of companies' real financial management journey and reorganized features around them — Organize, Move, and Track. I used Miro for collaborative flow mapping and Figma to validate the new navigation structure.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#1D5F6B;margin-bottom:7px\"><span style=\"display:{{ dPt }}\">UX Writing e apresentação<\u002Fspan><span style=\"display:{{ dEn }}\">UX Writing &amp; presentation<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:16.5px\"><span style=\"display:{{ dPt }}\">Liderei também o UX Writing, trabalhando termos e rótulos claros e agnósticos o suficiente para empresas de diferentes perfis, e apresentei a proposta de reestruturação para a liderança.<\u002Fspan><span style=\"display:{{ dEn }}\">I also led UX Writing, crafting terms and labels clear and generic enough for companies of different profiles, and presented the restructuring proposal to leadership.<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px;{{ railEdge }}\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Papel<\u002Fspan><span style=\"display:{{ dEn }}\">Role<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:14px\"><span style=\"display:{{ dPt }}\">Liderança de UX Research, UX Writing &amp; CX<\u002Fspan><span style=\"display:{{ dEn }}\">UX Research, UX Writing &amp; CX Lead<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#565C60;margin-bottom:6px\"><span style=\"display:{{ dPt }}\">Contexto<\u002Fspan><span style=\"display:{{ dEn }}\">Context<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1D5F6B\">Conta Simples<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #D3D2C6;padding-top:18px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1E\"><span style=\"display:{{ dPt }}\">Impacto<\u002Fspan><span style=\"display:{{ dEn }}\">Impact<\u002Fspan><\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1\"><span style=\"display:{{ dPt }}\">Nova arquitetura adotada<\u002Fspan><span style=\"display:{{ dEn }}\">New architecture adopted<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:13px;color:#565C60\"><span style=\"display:{{ dPt }}\">features reorganizadas em torno da jornada real — Organizar, Movimentar e Acompanhar<\u002Fspan><span style=\"display:{{ dEn }}\">features reorganized around the real journey — Organize, Move, and Track<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;pad
